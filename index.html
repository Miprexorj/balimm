<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünyanın En Güzeline...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Arka Plan Videosu */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: 0;
            filter: brightness(0.5) blur(2px); /* Videoyu biraz yumuşattık */
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 80%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.9);
            margin-bottom: 10px;
            font-weight: 800;
        }

        h2 {
            font-size: 1.8rem;
            color: #ff85a1;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #plead-text {
            height: 40px;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 40px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .buttons {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        button {
            padding: 18px 50px;
            font-size: 1.4rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff85a1);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.6);
        }

        #yesBtn:hover { 
            transform: scale(1.15) rotate(-2deg); 
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.8);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="leyla.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <audio id="yesMusic" src="azra.mp4"></audio>
    <audio id="noMusic" src="leyla.mp4"></audio>

    <div class="container">
        <h1>Dünyanın En Güzel kızına...</h1>
        <h2 id="main-title"> hayatımın geri kalanında yanımda olur musun? ❤️</h2>
        <div id="plead-text">Cevabını bekliyorum prensesim...</div>
        
        <div class="buttons">
            <button id="yesBtn" onclick="accept()">EVET!</button>
            <button id="noBtn" onmouseover="moveAndPlead()" onclick="moveAndPlead()">HAYIR</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const messages = [
            "Aşkım, emin misin? 🥺",
            "Dünyanın en güzeli bunu yapmaz...",
            "Kalbimi şu an çıt diye kırıyorsun!",
            "Bir kez daha düşün derim şanslıyız!",
            "Hayır butonu bozuldu galiba? :)"
        ];

        function moveAndPlead() {
            const noBtn = document.getElementById('noBtn');
            const pleadText = document.getElementById('plead-text');
            const noMusic = document.getElementById('noMusic');

            noMusic.play();

            if (clickCount < 5) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';

                pleadText.innerText = messages[clickCount];
                clickCount++;
            } else {
                noBtn.style.display = 'none';
                pleadText.innerText = "Seni ne kadar çok sevdiğimi biliyorsun, kaçışın yok! ❤️";
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        function accept() {
            const title = document.getElementById('main-title');
            const pleadText = document.getElementById('plead-text');
            const yesMusic = document.getElementById('yesMusic');
            const noMusic = document.getElementById('noMusic');
            const mainH1 = document.querySelector('h1');

            noMusic.pause();
            yesMusic.play();

            mainH1.innerHTML = "Birtanem";
            title.innerHTML = "Seni çok seviyorum sevgilim muahh";
            pleadText.innerText = "İyi ki varsın, hep yanımda kal...";
            document.querySelector('.buttons').style.display = 'none';
            
            // Arka planı canlandır
            document.body.style.background = "linear-gradient(rgba(255, 77, 109, 0.4), rgba(0,0,0,0.7))";
            
            // Kalp yağmurunu başlat
            setInterval(createHeart, 300);
        }
    </script>
</body>
</html>
